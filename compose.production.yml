name: meetings-izdrail

services:
  meeting-bot:
    image: izdrail/meetings.izdrail.com:${IMAGE_TAG:-latest}
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      UPLOADER_TYPE: local
      RECORDINGS_DIR: /recordings
      TRANSCRIPTION_ENABLED: ${TRANSCRIPTION_ENABLED:-true}
      TRANSCRIPTION_URL: ${TRANSCRIPTION_URL:-http://whisper:9000/asr}
      TRANSCRIPTION_LANGUAGE: ${TRANSCRIPTION_LANGUAGE:-}
      TRANSCRIPTION_MODEL: ${TRANSCRIPTION_MODEL:-small}
      TRANSCRIPTION_TIMEOUT_MINUTES: ${TRANSCRIPTION_TIMEOUT_MINUTES:-60}
      DASHBOARD_DATA_DIR: /data
      DASHBOARD_STATE_PATH: /data/meeting-bot-dashboard.json
      AUTH_PROFILES_DIR: /data/auth-profiles
      REDIS_HOST: redis
      # Chrome runs in this container by default. Override via .env to use an
      # external CDP endpoint instead (e.g. http://host.docker.internal:9223).
      GOOGLE_CHROME_CDP_URL: ${GOOGLE_CHROME_CDP_URL-http://127.0.0.1:9222}
      CHROME_USER_DATA_DIR: /data/chrome-profile
    ports:
      - "${APP_PORT_HOST:-3000}:3000"
      - "127.0.0.1:${AUTH_CONSOLE_PORT_HOST:-6080}:6080"
    shm_size: "1gb"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - recordings:/recordings
      - dashboard_data:/data
      - recordings_tmp:/usr/src/app/dist/_tempvideo
    depends_on:
      redis:
        condition: service_healthy
      whisper:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

  whisper:
    image: onerahmet/openai-whisper-asr-webservice:v1.8.2
    restart: unless-stopped
    environment:
      ASR_ENGINE: faster_whisper
      ASR_MODEL: ${TRANSCRIPTION_MODEL:-small}
    volumes:
      - whisper_cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/docs"]
      interval: 30s
      timeout: 10s
      start_period: 10m
      retries: 10


  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT_HOST:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  redis_data:
  recordings:
  dashboard_data:
  recordings_tmp:
  whisper_cache:
